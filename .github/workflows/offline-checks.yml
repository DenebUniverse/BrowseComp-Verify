name: Offline checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m browsecomp_verify.data --data_path data/diamond.jsonl
      - run: python -m browsecomp_verify.run --agent gptoss --data_path data/diamond.jsonl --dry_run
